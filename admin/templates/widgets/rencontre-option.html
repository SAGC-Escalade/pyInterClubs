{% with widget.value.instance as r %}
<div class="row mx-0 p-1 border border-start-0 border-end-0 border-bottom-0 bg-light-hover">
    <div class="col-1">{% include "django/forms/widgets/input.html" %}</div>
    <div class="col-1">
        {% if r.categorie == 1 %}<i class="fa-solid fa-child fa-sm" title="Enfants"></i>
        {% elif r.categorie == 2 %}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<i class="fa-solid fa-person" title="Adolescents"></i>
        {% endif %}
    </div>
    <div class="col-3">{{ r.date }}</div>
    <div class="col-2">{{ r.club.ville }}</div>
    <div class="col">{{ r.equipes_count }}</div>
    <div class="col">{{ r.grimpeurs_count }}</div>
    <div class="col-2 d-flex">
        <button class="btn btn-link btn-sm py-0" disabled><i class="fa-solid fa-eye"></i></button>
        {% if r.users_count %}
            <a href="{% url 'rencontre:stop' r.id %}" class="btn btn-link btn-sm py-0">
                <i class="fa-solid fa-stop"></i>
            </a>
            <a href="{% url 'rencontre:qrcode-clubs' %}?rencontre={{ r.id }}" class="btn btn-link btn-sm py-0">
                <i class="fa-solid fa-qrcode"></i>
            </a>
        {% else %}
            <a href="{% url 'rencontre:start' r.id %}" class="btn btn-link btn-sm py-0">
                <i class="fa-solid fa-play"></i>
            </a>
        {% endif %}
        <a href="{% url 'rencontre:delete' r.id %}" class="btn btn-link text-danger btn-sm py-0 ms-auto">
            <i class="fa-solid fa-trash"></i>
        </a>
    </div>
</div>
{% endwith %}
