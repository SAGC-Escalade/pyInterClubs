{% load format %}

<h2>Statistiques d'utilisation des voies</h2>

<div class="no-page-break">
    <canvas id="voiesChart" width="800" height="400"></canvas>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const ctx = document.getElementById('voiesChart').getContext('2d');

        // Mapping des couleurs en fonction des labels
        const labelColors = {
            'Homme':      { backgroundColor: 'rgba(173, 216, 230, 0.5)', borderColor: 'rgba(173, 216, 230, 1)', barPercentage: 1 }, // Bleu clair
            'Femme':      { backgroundColor: 'rgba(255, 182, 193, 0.5)', borderColor: 'rgba(255, 182, 193, 1)', barPercentage: 1 }, // Rose clair
            'Mixte':      { backgroundColor: 'rgba(192, 192, 192, 0.5)', borderColor: 'rgba(192, 192, 192, 1)', barPercentage: 1 }, // Gris clair
            'Chute':      { backgroundColor: 'rgba(255, 69, 0, 0.5)',    borderColor: 'rgba(255, 69, 0, 1)'    }, // Rouge orangé
            'Zone':       { backgroundColor: 'rgba(144, 238, 144, 0.5)', borderColor: 'rgba(144, 238, 144, 1)' }, // Vert lime
            'Zone 1':     { backgroundColor: 'rgba(144, 238, 144, 0.5)', borderColor: 'rgba(144, 238, 144, 1)' }, // Vert lime
            'Zone 2':     { backgroundColor: 'rgba(50, 205, 50, 0.5)',   borderColor: 'rgba(50, 205, 50, 1)'   }, // Vert clair
            'Top':        { backgroundColor: 'rgba(34, 139, 34, 0.5)',   borderColor: 'rgba(34, 139, 34, 1)'   }, // Vert foncé
            '3e Essai':   { backgroundColor: 'rgba(144, 238, 144, 0.5)', borderColor: 'rgba(144, 238, 144, 1)' }, // Vert lime
            '2e Essai':   { backgroundColor: 'rgba(50, 205, 50, 0.5)',   borderColor: 'rgba(50, 205, 50, 1)'   }, // Vert clair
            '1er Essai':  { backgroundColor: 'rgba(34, 139, 34, 0.5)',   borderColor: 'rgba(34, 139, 34, 1)'   }, // Vert foncé
            'Bloc':       { backgroundColor: 'rgba(230, 230, 250, 0.5)', borderColor: 'rgba(230, 230, 250, 1)' }, // Lavande clair
            'Difficulté': { backgroundColor: 'rgba(186, 85, 211, 0.5)',  borderColor: 'rgba(186, 85, 211, 1)'  }, // Orchidée moyen
            'Vitesse':    { backgroundColor: 'rgba(148, 0, 211, 0.5)',   borderColor: 'rgba(148, 0, 211, 1)'   }, // Violet foncé
        };

        // Couleurs par défaut si le label n'est pas dans `labelColors`
        const defaultColors = [
            { backgroundColor: 'rgba(144, 238, 144, 0.5)', borderColor: 'rgba(144, 238, 144, 1)' }, // Vert clair
            { backgroundColor: 'rgba(255, 200, 87, 0.5)',  borderColor: 'rgba(255, 200, 87, 1)'  }, // Orange clair
            { backgroundColor: 'rgba(138, 43, 226, 0.5)',  borderColor: 'rgba(138, 43, 226, 1)'  }, // Violet foncé
            { backgroundColor: 'rgba(255, 223, 0, 0.5)',   borderColor: 'rgba(255, 223, 0, 1)'   }, // Jaune doré
            { backgroundColor: 'rgba(64, 224, 208, 0.5)',  borderColor: 'rgba(64, 224, 208, 1)'  }, // Turquoise
            { backgroundColor: 'rgba(107, 142, 35, 0.5)',  borderColor: 'rgba(107, 142, 35, 1)'  }, // Vert olive
            { backgroundColor: 'rgba(255, 140, 0, 0.5)',   borderColor: 'rgba(255, 140, 0, 1)'   }, // Orange foncé
            { backgroundColor: 'rgba(216, 191, 216, 0.5)', borderColor: 'rgba(216, 191, 216, 1)' }, // Violet clair
        ];
        let defaultIndex = 0;

        // Données injectées depuis le contexte Django
        const data = {
            labels: {{ stats.labels|safe }}, // Noms des voies
            datasets: [
                // Dataset des temps (scatter)
                {
                    type: 'scatter',
                    label: 'Temps (s)',
                    data: {{ stats.temps|safe }},
                    backgroundColor: 'rgba(148, 0, 211, 0.5)',
                    borderColor: 'rgba(148, 0, 211, 1)',
                    yAxisID: 't',
                },

                // Dataset des résultats
                {% for label,dataset in stats.datasets.items %}
                    {
                        stack: '{{ label.0 }}',
                        label: '{{ label.1|title }}',
                        data: {{ dataset|safe }},
                        ...(
                            labelColors['{{ label.1|title }}'] || 
                            defaultColors[defaultIndex++ % defaultColors.length] // Couleurs automatiques si non défini
                        ),
                    },
                {% endfor %}
            ]
        };

        const config = {
            type: 'bar',
            data: data,
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            usePointStyle: true,
                        },
                    },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                        callbacks: {
                          footer: footer,
                        }
                    },
                },
                scales: {
                    x: {
                        stacked: true,
                        title: {
                            display: true,
                            text: 'Voies'
                        },
                    },
                    y: {
                        stacked: true,
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Nombre de grimpeurs'
                        },
                        min: 0,
                        max: {{ stats.max|safe }},
                        stepSize: 10,
                    },
                    t: {
                        type: 'linear',
                        position: 'right',
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Temps (s)'
                        },
                        min: 0,
                        max: {{ stats.max|safe }},
                        stepSize: 10,
                    }
                },
                datasets: {
                    bar: {
                        borderWidth: 2,
                        borderRadius: 5,
                        categoryPercentage: 1,
                        barPercentage: 0.4,
                        offset: true,
                        pointStyle: 'rectRounded',
                    }
                },
                elements: {
                    point: {
                        pointStyle: 'rectRot',
                        borderWidth: 2,
                        radius: 5,
                        hoverRadius: 7,
                    }
                }
            }
        };

        new Chart(ctx, config);
    });

    const footer = (tooltipItems) => {
      let sum = 0;

      tooltipItems.forEach(function(tooltipItem) {
        if (tooltipItem.dataset.stack == "genre")
            sum += tooltipItem.parsed.y;
      });
      return 'Total: ' + sum;
    };
</script>
