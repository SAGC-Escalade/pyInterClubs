{% extends request.htmx|yesno:"base.html,index.html" %}
{% load django_bootstrap5 %}

{% block body %}
{% if user.is_authenticated %}
    {% for e in request.interclub.equipes %}
        <a href="{% url 'equipe:edit' e.ID %}" class="list-group-item list-group-item-action d-flex align-items-center" hx-boost="false">
            <i class="fa-solid fa-fw me-2"></i>
            {{ e }}
        </a>
    {% endfor %}
{% endif %}
{% endblock %}
