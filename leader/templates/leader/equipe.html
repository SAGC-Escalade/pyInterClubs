{% extends "index.html" %}
{% load babel_transpiling %}

{% block title %}Equipe {{ object }}{% endblock %}

{% block head %}
    <style>
        .sexe  { color: rgba(0,0,0,.3); }
        .femme { color: lightpink; }
        .homme { color: lightblue; }
    </style>
{% endblock %}

{% block body %}
    <div id="react-equipe" class="container" />
{% endblock %}

{% block script %}
    <script type="module">
        import Equipe from "/react/equipe.jsx";
        const { QueryClient, QueryClientProvider } = window.ReactQuery;
        const queryClient = new QueryClient();
        {% transpiling %}
        ReactDOM.createRoot(document.querySelector('#react-equipe')).render(
            <QueryClientProvider client={queryClient}>
                <Equipe id="{{ object.id }}" />
            </QueryClientProvider>
        )
        {% endtranspiling %}
    </script>
{% endblock %}
