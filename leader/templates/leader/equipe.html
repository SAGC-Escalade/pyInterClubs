{% extends "index.html" %}
{% load babel_transpiling %}

{% block title %}{{ object }}{% endblock %}

{% block nav-items %}
    <li class="nav-item">
        <a class="nav-link active" href="{{ request.path }}">
            <i class="d-md-none fa-solid fa-user-group fa-fw me-2"></i>{{ object }}
        </a>
    </li>
{% endblock %}

{% block head %}
    <style>
        .sexe  { color: rgba(0,0,0,.3); }
        .femme { color: lightpink; }
        .homme { color: lightblue; }
    </style>
{% endblock %}

{% block body %}
    <div id="react-equipe" class="container" />
{% endblock %}

{% block script %}
    <script type="module">
        import App from "/react/app.jsx";
        import Equipe from "/react/equipe.jsx";
        {% transpiling %}
        ReactDOM.createRoot(document.querySelector('#react-equipe')).render(
            <App csrf={ "{{ csrf_token }}" }>
                <Equipe id="{{ object.id }}" />
            </App>
        )
        {% endtranspiling %}
    </script>
{% endblock %}
