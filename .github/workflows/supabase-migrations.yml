name: Supabase migrations

# Applique les migrations SQL (web/supabase/migrations/) sur la bonne base
# selon la branche :
#   migration/main    -> GitHub Environment "prod"     -> projet Supabase prod
#   migration/develop -> GitHub Environment "recette"  -> projet Supabase recette
#
# Les identifiants viennent des secrets de l'environnement GitHub correspondant
# (cf. docs/ci-supabase.md).

on:
  push:
    branches:
      - migration/main
      - migration/develop
    paths:
      - "web/supabase/migrations/**"
      - "web/supabase/config.toml"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch: # déclenchement manuel possible

# Évite deux push concurrents sur la même base.
concurrency:
  group: supabase-db-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  db-push:
    runs-on: ubuntu-latest

    # main -> prod, toute autre branche déclenchée (develop) -> recette
    environment: ${{ github.ref_name == 'migration/main' && 'prod' || 'recette' }}

    defaults:
      run:
        working-directory: web # le dossier supabase/ est sous web/

    env:
      # Jeton de compte Supabase (secret au niveau du dépôt, partagé)
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Mot de passe DB (secret propre à chaque environnement)
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer le Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Lier le projet Supabase
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          # Référence du projet (secret propre à chaque environnement)
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Appliquer les migrations
        run: supabase db push

      - name: Récapitulatif
        run: |
          echo "Branche      : ${{ github.ref_name }}"
          echo "Environnement: ${{ github.ref_name == 'migration/main' && 'prod' || 'recette' }}"
          echo "Migrations appliquées avec succès."
