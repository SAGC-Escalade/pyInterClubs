# Configuration du projet Supabase local (Supabase CLI).
# `supabase start` lance Postgres + Realtime + Auth + Studio en local (Docker).

project_id = "pyinterclubs"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = false

[analytics]
enabled = false
