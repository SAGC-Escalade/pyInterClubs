{% if user.is_authenticated %}
    {% for e in request.interclub.equipes %}
        <a href="{% url 'equipe:edit' e.ID %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" hx-boost="false">
            {{ e }}
            <i class="fa-solid fa-users"></i>
        </a>
    {% endfor %}
{% endif %}
